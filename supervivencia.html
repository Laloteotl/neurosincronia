<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>SUPERVIVENCIA</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
<style>
body{
background:#000;
color:#00ff41;
font-family:'Share Tech Mono',monospace;
padding:48px;
max-width:1000px;
margin:auto;
}
h1{
font-family:'Rajdhani',sans-serif;
color:#fff;
font-size:3rem;
}
section{
border:1px solid #00aa2a;
padding:24px;
margin:20px 0;
}
button{
background:#000;
color:#00ff41;
border:1px solid #00aa2a;
padding:14px 24px;
margin:10px;
cursor:pointer;
font-family:'Share Tech Mono',monospace;
}
a{
color:#00ff41;
text-decoration:none;
}
#content{
white-space:pre-line;
line-height:1.8;
}
</style>
</head>
<body>

<h1>01 — SUPERVIVENCIA</h1>

<section>
<div id="content"></div>
<div id="actions"></div>
</section>

<a href="index.html">← VOLVER</a>

<script>

const steps={
999:{text:`Transferencia completada.`,buttons:[["CONTINUAR",0]]},

0:{
text:`Inventario vital.

¿Tienes refugio seguro esta noche?`,
buttons:[["SÍ",2],["NO",1]]
},

1:{
text:`Localiza refugio inmediato.

Biblioteca
Centro comunitario
Escuela
Hospital
Espacio público seguro`,
buttons:[["CONFIRMAR",2]]
},

2:{
text:`¿Tienes agua potable?`,
buttons:[["SÍ",4],["NO",3]]
},

3:{
text:`Consigue agua ahora.

Sin agua no hay sistema.`,
buttons:[["LISTO",4]]
},

4:{
text:`¿Tienes alimento útil?`,
buttons:[["SÍ",6],["NO",5]]
},

5:{
text:`Prioridad:

resolver alimento antes de productividad.`,
buttons:[["RESUELTO",6]]
},

6:{
text:`¿Dispositivo operativo?`,
buttons:[["SÍ",8],["NO",7]]
},

7:{
text:`Busca acceso comunitario:

biblioteca
cibercafé
equipo prestado`,
buttons:[["LISTO",8]]
},

8:{
text:`Supervivencia mínima confirmada.

Transferencia autorizada al núcleo.`,
buttons:[["FINALIZAR",9]]
},

9:{
text:`Sistema base estable.`,
buttons:[["SIGUIENTE",999]]
}

};

let current=parseInt(localStorage.getItem(location.pathname))||0;

function render(){

const c=document.getElementById("content");
const a=document.getElementById("actions");

c.innerText=steps[current].text;
a.innerHTML="";

steps[current].buttons.forEach(([label,next])=>{

const b=document.createElement("button");
b.innerText=label;

b.onclick=()=>{
current=next;
if(next===999){if(location.pathname.includes('supervivencia'))location.href='crisis.html';if(location.pathname.includes('crisis'))location.href='productividad.html';if(location.pathname.includes('productividad'))location.href='dinero.html';if(location.pathname.includes('dinero'))location.href='infraestructura.html';if(location.pathname.includes('infraestructura'))location.href='proyectos.html';if(location.pathname.includes('proyectos'))location.href='comunidad.html';if(location.pathname.includes('comunidad'))location.href='index.html';}
localStorage.setItem(location.pathname,current);
render();
};

a.appendChild(b);

});

}

render();

</script>

</body>
</html>
