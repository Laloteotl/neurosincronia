<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>CRISIS</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body{
background:#000;
color:#00ff41;
font-family:'Share Tech Mono', monospace;
padding:48px;
max-width:1000px;
margin:auto;
}

h1{
font-family:'Rajdhani',sans-serif;
color:#fff;
font-size:3rem;
}

section{
border:1px solid #00aa2a;
padding:24px;
margin:20px 0;
}

button{
background:#000;
color:#00ff41;
border:1px solid #00aa2a;
padding:14px 24px;
margin:10px;
cursor:pointer;
font-family:'Share Tech Mono', monospace;
}

button:hover{
background:#002200;
}

input{
width:100%;
padding:14px;
margin-top:20px;
background:#000;
color:#00ff41;
border:1px solid #00aa2a;
font-family:'Share Tech Mono', monospace;
}

a{
color:#00ff41;
text-decoration:none;
}

strong{
color:#fff;
}
</style>
</head>
<body>

<h1>02 — CRISIS</h1>

<section>
<div id="content"></div>
<div id="actions"></div>
</section>

<a href="index.html">← VOLVER</a>

<script>

const steps={

0:{
text:"¿Puedes mover manos o pies?",
buttons:[["Sí",1],["No",2]]
},

1:{
text:"¿Consumiste agua en últimas 2 horas?",
buttons:[["Sí",4],["No",3]]
},

2:{
text:"No estás roto.\nTu sistema está congelado.\n\nMueve un dedo.\nLuego otro.\nLuego muñecas.\nLuego pies.",
buttons:[["Listo",1]]
},

3:{
text:"El pensamiento actual no es criterio confiable.\n\nLevántate.\nLlena un vaso.\nBébelo completo.",
buttons:[["Hecho",4]]
},

4:{
text:"¿Comiste en últimas 4 horas?",
buttons:[["Sí",6],["No",5]]
},

5:{
text:"Consume energía mínima:\n\nFruta\nPan\nYogurt\nProteína simple",
buttons:[["Listo",6]]
},

6:{
text:"¿Qué tema activa tu curiosidad ahora?",
input:true,
next:7
},

7:{
text:"Abre GPT, Gemini o NotebookLM.\n\nInvestiga durante 15 minutos.\n\nCrea nota markdown.",
buttons:[["Terminé",8]]
},

8:{
text:"Hiperfoco detectado.\n\nSistema estabilizado.\n\nContinúa al módulo PRODUCTIVIDAD.",
buttons:[["Reiniciar",0]]
}

};

let current=0;

function render(){

const content=document.getElementById("content");
const actions=document.getElementById("actions");

content.innerText=steps[current].text;
actions.innerHTML="";

if(steps[current].input){

const input=document.createElement("input");

const btn=document.createElement("button");
btn.innerText="Continuar";

btn.onclick=()=>{
current=steps[current].next;
render();
};

actions.appendChild(input);
actions.appendChild(btn);

}else{

steps[current].buttons.forEach(([label,next])=>{

const btn=document.createElement("button");
btn.innerText=label;

btn.onclick=()=>{
current=next;
render();
};

actions.appendChild(btn);

});

}

}

render();

</script>

</body>
</html>
