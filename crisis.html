<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>NEUROSINCRONÍA // CRISIS</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body{
background:#000;
color:#00ff41;
font-family:'Share Tech Mono',monospace;
padding:48px;
max-width:1000px;
margin:auto;
}

h1{
font-family:'Rajdhani',sans-serif;
font-size:3rem;
color:#fff;
margin-bottom:8px;
}

.small{
opacity:.6;
margin-bottom:32px;
}

section{
border:1px solid #00aa2a;
padding:32px;
margin:24px 0;
min-height:280px;
}

button{
background:#000;
color:#00ff41;
border:1px solid #00aa2a;
padding:14px 22px;
margin:12px 8px;
cursor:pointer;
font-family:'Share Tech Mono',monospace;
}

button:hover{
background:#001100;
}

input{
width:100%;
padding:16px;
margin-top:20px;
background:#000;
color:#00ff41;
border:1px solid #00aa2a;
font-family:'Share Tech Mono',monospace;
}

a{
color:#00ff41;
text-decoration:none;
}

#content{
white-space:pre-line;
line-height:1.9;
font-size:1.05rem;
}
</style>
</head>
<body>

<h1>02 // CRISIS</h1>
<div class="small">
PROTOCOLO DE RECUPERACIÓN EJECUTIVA
</div>

<section>
<div id="content"></div>
<div id="actions"></div>
</section>

<a href="index.html">← REGRESAR AL NÚCLEO</a>

<script>

const steps={

0:{
text:`Confirmación motora requerida.

¿Puedes mover manos o pies?`,
buttons:[["SÍ",1],["NO",2]]
},

1:{
text:`Diagnóstico parcial:

El sistema conserva respuesta motora.

Procediendo a estabilización hídrica.

¿Consumiste agua recientemente?`,
buttons:[["SÍ",4],["NO",3]]
},

2:{
text:`Congelamiento ejecutivo detectado.

No analices.

Mueve un dedo.

Ahora otro.

Ahora ambas muñecas.

Ahora ambos pies.

Ejecuta. Luego confirma.`,
buttons:[["CONFIRMAR",1]]
},

3:{
text:`La interpretación actual está degradada.

No confíes en ella.

Levántate.

Llena un vaso.

Bébelo completo.

Regresa aquí.`,
buttons:[["HECHO",4]]
},

4:{
text:`Verificando combustible metabólico.

¿Consumiste alimento útil recientemente?`,
buttons:[["SÍ",6],["NO",5]]
},

5:{
text:`Carga insuficiente detectada.

Consume:

fruta
proteína
pan
yogurt

No optimices.
Ejecuta.`,
buttons:[["COMPLETADO",6]]
},

6:{
text:`La red cortical comienza recuperación.

Indica qué conocimiento activa tu atención ahora.`,
input:true,
next:7
},

7:{
text:`Canalización iniciada.

Abre tu sistema de investigación.

Extrae una idea nueva.

Registra hallazgo.

Consolida tracción cognitiva.`,
buttons:[["CONTINUAR",8]]
},

8:{
text:`RECUPERACIÓN CONFIRMADA

El sistema volvió a sincronía.

Transferencia autorizada al módulo PRODUCTIVIDAD.`,
buttons:[["REINICIAR",0]]
}

};

let current=0;

function render(){

const c=document.getElementById("content");
const a=document.getElementById("actions");

c.innerText=steps[current].text;
a.innerHTML="";

if(steps[current].input){

const i=document.createElement("input");

const b=document.createElement("button");
b.innerText="ENVIAR";

b.onclick=()=>{
current=steps[current].next;
render();
};

a.appendChild(i);
a.appendChild(b);

}else{

steps[current].buttons.forEach(([label,next])=>{

const b=document.createElement("button");
b.innerText=label;

b.onclick=()=>{
current=next;
render();
};

a.appendChild(b);

});

}

}

render();

</script>

</body>
</html>
