<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>COMUNIDAD // UN PARO</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
<style>
body{
background:#000;
color:#00ff41;
font-family:'Share Tech Mono',monospace;
padding:48px;
max-width:1000px;
margin:auto;
}
h1{
font-family:'Rajdhani',sans-serif;
color:#fff;
font-size:3rem;
}
section{
border:1px solid #00aa2a;
padding:24px;
margin:20px 0;
}
button{
background:#000;
color:#00ff41;
border:1px solid #00aa2a;
padding:14px 24px;
margin:10px;
cursor:pointer;
font-family:'Share Tech Mono',monospace;
}
a{
color:#00ff41;
text-decoration:none;
}
#content{
white-space:pre-line;
line-height:1.8;
}
</style>
</head>
<body>

<h1>07 — UN PARO</h1>

<section>
<div id="content"></div>
<div id="actions"></div>
</section>

<a href="index.html">← VOLVER</a>

<script>

const steps={

0:{
text:`¿Necesitas apoyo real?`,
buttons:[["SÍ",1],["NO",8]]
},

1:{
text:`¿Qué necesitas?`,
buttons:[
["DINERO",2],
["COMIDA",2],
["INTERNET",2],
["TRANSPORTE",2],
["CONTACTO",2]
]
},

2:{
text:`¿Qué puedes ofrecer?`,
buttons:[
["TRABAJO",3],
["TRUEQUE",3],
["SERVICIO DIGITAL",3],
["COLABORAR EN PROYECTOS",3],
["DIFUSIÓN",3],
["MENTORÍA",3],
["APRENDER Y EJECUTAR",3]
]
},

3:{
text:`El sistema publicará tu ficha:

Necesita:
(recurso)

Ofrece:
(valor)

Buscando coincidencias...`,
buttons:[["CONTINUAR",4]]
},

4:{
text:`Posibles match:

Persona necesita lo que ofreces.

Persona ofrece lo que buscas.`,
buttons:[["CONTINUAR",5]]
},

5:{
text:`Coordina por chat interno.

Intercambio directo.

Sin intermediarios.`,
buttons:[["FINALIZAR",8]]
},

8:{
text:`Sistema social estabilizado.`,
buttons:[["REINICIAR",0]]
}

};

let current=parseInt(localStorage.getItem(location.pathname))||0;

function render(){

const c=document.getElementById("content");
const a=document.getElementById("actions");

c.innerText=steps[current].text;
a.innerHTML="";

steps[current].buttons.forEach(([label,next])=>{

const b=document.createElement("button");
b.innerText=label;

b.onclick=()=>{
current=next;
localStorage.setItem(location.pathname,current);
render();
};

a.appendChild(b);

});

}

render();

</script>

</body>
</html>
