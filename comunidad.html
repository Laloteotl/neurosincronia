<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>COMUNIDAD // UN PARO</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
<style>
body{
background:#000;
color:#00ff41;
font-family:'Share Tech Mono',monospace;
padding:48px;
max-width:1000px;
margin:auto;
}
h1{
font-family:'Rajdhani',sans-serif;
color:#fff;
font-size:3rem;
}
section{
border:1px solid #00aa2a;
padding:24px;
margin:20px 0;
}
button{
background:#000;
color:#00ff41;
border:1px solid #00aa2a;
padding:14px 24px;
margin:10px;
cursor:pointer;
font-family:'Share Tech Mono',monospace;
}
input,textarea{
width:100%;
padding:14px;
margin-top:10px;
background:#000;
color:#00ff41;
border:1px solid #00aa2a;
font-family:'Share Tech Mono',monospace;
}
a{
color:#00ff41;
text-decoration:none;
}
#content{
white-space:pre-line;
line-height:1.8;
}
</style>
</head>
<body>

<h1>07 — UN PARO</h1>

<section>
<div id="content"></div>
<div id="actions"></div>
</section>

<a href="index.html">← VOLVER</a>

<script>

const steps={

0:{
text:`Protocolo comunitario activado.

Aquí no mendigas.

Intercambias valor.

¿Necesitas apoyo real?`,
buttons:[["SÍ",1],["NO",6]]
},

1:{
text:`Declara tu situación.`,
form:true,
next:2
},

2:{
text:`¿Qué necesitas resolver?`,
buttons:[
["DINERO",3],
["INTERNET",3],
["COMIDA",3],
["TRANSPORTE",3],
["CONTACTO",3]
]
},

3:{
text:`¿Qué ofreces a cambio?`,
form:true,
next:4
},

4:{
text:`Coincidencia comunitaria iniciada.

El sistema buscará:

Tengo → Necesitas
Necesito → Ofreces`,
buttons:[["CONTINUAR",5]]
},

5:{
text:`Match operativo generado.

Coordina intercambio directo.

Cierra trato fuera de plataforma.`,
buttons:[["FINALIZAR",6]]
},

6:{
text:`Sistema social estabilizado.`,
buttons:[["REINICIAR",0]]
}

};

let current=0;

function render(){

const c=document.getElementById("content");
const a=document.getElementById("actions");

c.innerText=steps[current].text;
a.innerHTML="";

if(steps[current].form){

const t=document.createElement("textarea");

const b=document.createElement("button");
b.innerText="CONTINUAR";

b.onclick=()=>{
current=steps[current].next;
render();
};

a.appendChild(t);
a.appendChild(b);

}else{

steps[current].buttons.forEach(([label,next])=>{

const b=document.createElement("button");
b.innerText=label;

b.onclick=()=>{
current=next;
render();
};

a.appendChild(b);

});

}

}

render();

</script>

</body>
</html>
